<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Artifacts</title>
    <!-- Static defaults for the whole SPA (no SSR — see apps/api/src/app.ts's readFileSync fallback).
         The sign-in screen (pages/auth/AuthI18nProvider) swaps <title> at runtime for JS-executing
         crawlers, but social unfurlers (Telegram, Slack, X, Facebook) never run JS, so they always
         see this Russian version — acceptable since Russian is the primary audience and matches
         the document's default lang. This is a private, self-hosted instance now (the public
         marketing pitch moved to https://emaxe.github.io/open-artifacts/, apps/landing), so the
         description below describes the sign-in screen rather than pitching the product. -->
    <meta name="description" content="Вход в self-hosted хостинг артефактов для AI-агентов." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Artifacts" />
    <meta property="og:title" content="Open Artifacts" />
    <meta property="og:description" content="Вход в self-hosted хостинг артефактов для AI-агентов." />
    <meta property="og:image" content="/brand/logo-lockup.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applied before first paint to avoid a light-mode flash for dark-theme users. Keep this in
      // sync with apps/web/src/lib/theme.tsx's STORAGE_KEY and ThemePreference values.
      try {
        var t = localStorage.getItem("oa_theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
