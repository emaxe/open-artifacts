title: "Constructor — all blocks"
layout: default
lang: en
width: normal
back_to_top: true

blocks:
  - type: hero
    title: "Constructor 0.13"
    subtitle: "All 41 blocks of the constructor on one page"
    badge: "Showcase"
    meta: "Every new block on one page"

  - type: toc
    title: "On this page"
    variant: sticky
    depth: 2

  - type: section
    title: "Layout containers"
    eyebrow: "Containers"
    subtitle: "section, grid and stack nest to any depth."
    background: surface
    blocks:
      - type: grid
        cols: 3
        blocks:
          - type: kpi-row
            items:
              - { label: "Revenue", value: "$4.2M", delta: "+18%", trend: up, spark: [3, 4, 3.6, 5, 5.8, 6.4, 7.2] }
          - type: kpi-row
            items:
              - { label: "Churn", value: "1.2%", delta: "-0.2%", trend: down, spark: [2.1, 1.9, 1.8, 1.5, 1.4, 1.3, 1.2] }
          - type: kpi-row
            items:
              - { label: "NPS", value: "62", delta: "+4", trend: up, spark: [48, 51, 50, 55, 58, 60, 62] }
      - type: stack
        direction: row
        gap: sp-3
        blocks:
          - type: badge-row
            items: ["grid", "stack", "section", "two-columns"]
          - type: buttons
            items:
              - { label: "Read the spec", href: "#cards", variant: primary }
              - { label: "Open docs", href: "https://example.com/docs", variant: ghost }

  - type: text-section
    heading: "Media"
    body: "Images support titles, credits, links, aspect ratios and a grouped lightbox."

  - type: image
    src: showcase-assets/photo-1.svg
    title: "Single image"
    caption: "Click to zoom — **caption** supports Markdown."
    credit: "Photo: generated"
    zoomable: true
    aspect: "16:9"
    width: "70%"
    border: true

  - type: gallery
    cols: 3
    captions: hover
    max_visible: 5
    items:
      - { src: showcase-assets/photo-1.svg, title: "Dunes", caption: "Golden hour" }
      - { src: showcase-assets/photo-2.svg, title: "Harbor", caption: "Low tide" }
      - { src: showcase-assets/photo-3.svg, title: "Canyon" }
      - { src: showcase-assets/photo-4.svg, title: "Forest" }
      - { src: showcase-assets/photo-5.svg, title: "Glacier" }
      - { src: showcase-assets/photo-6.svg, title: "Meadow" }

  - type: slideshow
    label: "Photo slideshow"
    nav: thumbs
    autoplay: 5000
    captions: overlay
    zoomable: true
    items:
      - { src: showcase-assets/photo-2.svg, title: "Harbor", caption: "Slide one" }
      - { src: showcase-assets/photo-3.svg, title: "Canyon", caption: "Slide two" }
      - { src: showcase-assets/photo-5.svg, title: "Glacier", caption: "Slide three" }

  - type: slideshow
    effect: fade
    nav: dots
    items:
      - blocks:
          - { type: alert, kind: info, title: "Slides can hold blocks", body: "Any block works inside a slide." }
      - blocks:
          - { type: kpi-row, items: [{ label: "Slides", value: "2" }, { label: "Effect", value: "fade" }] }

  - type: image-compare
    before: showcase-assets/before.svg
    after: showcase-assets/after.svg
    caption: "Drag the handle (or use arrow keys)"

  - type: section
    title: "Classic blocks"
    id: classic
    blocks:
      - type: alert
        kind: success
        title: "alert"
        body: "info / success / warning / error variants."
      - type: stats-grid
        cols: 3
        items:
          - { label: "Stats", value: "128", color: c1, spark: [1, 3, 2, 5, 4, 6] }
          - { label: "Grid", value: "42", color: c2 }
          - { label: "Cards", value: "9", color: c3 }
      - type: table
        caption: "table"
        sortable: true
        columns: [Block, Group, Since]
        rows:
          - [hero, Text, "0.1"]
          - [table, Data, "0.1"]
          - [gallery, Media, "0.13"]
      - type: chart-line
        title: "chart-line"
        labels: [Jan, Feb, Mar, Apr]
        datasets: [{ label: Visits, data: [3, 5, 4, 8] }]
      - type: chart-pie
        title: "chart-pie"
        donut: true
        labels: [Docs, Code, Other]
        data: [45, 40, 15]
      - type: two-columns
        ratio: "2:1"
        left:
          - { type: text-section, heading: "two-columns", level: 3, body: "Left column holds **text**." }
        right:
          - { type: alert, kind: warning, body: "Right column." }
      - type: tabs
        items:
          - label: "tabs"
            blocks:
              - { type: code-block, lang: javascript, caption: "code-block", code: "const answer = 42;\nconsole.log(answer);" }
          - label: "timeline"
            blocks:
              - type: timeline
                items:
                  - { date: "Q1", title: "Plan", status: done }
                  - { date: "Q2", title: "Build", status: active, body: "In progress" }
                  - { date: "Q3", title: "Ship" }
      - type: divider
        label: "divider"
      - type: spacer
        size: sp-5
      - type: markdown
        content: |
          ### markdown
          Inline **Markdown** with a [link](#cards) and a list:

          - one
          - two
      - type: raw
        html: '<p style="text-align:center;color:var(--fg-muted)">raw — arbitrary HTML</p>'

  - type: section
    title: "Cards"
    id: cards
    blocks:
      - type: cards
        cols: 3
        equal_height: true
        items:
          - title: "Image on top"
            image: showcase-assets/photo-4.svg
            body: "Cards take images, tags, badges and buttons."
            tags: [design, ui]
            buttons:
              - { label: "Open", href: "#faq" }
          - title: "Whole card links"
            subtitle: "href only"
            body: "No buttons, so the card itself is the link."
            href: "https://example.com"
            badge: "link"
          - title: "Image as background"
            image: showcase-assets/photo-6.svg
            image_position: background
            body: "Text sits on a scrim."
            footer: "Footer text"
      - type: cards
        cols: 2
        variant: outline
        items:
          - title: "Side image"
            image: showcase-assets/photo-5.svg
            image_position: left
            body: "Image on the left; stacks on phones."
            color: c3
          - title: "Nested blocks"
            blocks:
              - { type: progress-bars, items: [{ label: "Done", value: 72 }] }

  - type: text-section
    heading: "Accordion & FAQ"
    id: faq
    body: "Native disclosure panels; blocks (charts, diagrams) render when opened."

  - type: accordion
    default_open: first
    multiple: false
    items:
      - title: "What is an accordion?"
        body: "Native `<details>` — works without JavaScript and prints expanded."
      - title: "Can I put a chart inside?"
        blocks:
          - type: chart-bar
            title: "Hidden until opened"
            labels: [Q1, Q2, Q3]
            datasets: [{ label: Sales, data: [4, 7, 5] }]
      - title: "Diagrams too?"
        badge: mermaid
        blocks:
          - type: mermaid-diagram
            definition: |
              graph LR
                A[Closed] --> B[Open] --> C[Rendered]

  - type: section
    title: "Content blocks"
    blocks:
      - type: steps
        items:
          - { title: "Write the spec", body: "YAML or JSON.", status: done }
          - { title: "Build", body: "`node build.mjs spec.yaml`", status: active }
          - { title: "Share", body: "Push to your instance." }
      - type: quote
        variant: card
        text: "Declarative pages beat hand-written HTML every time."
        author: "A happy user"
        role: "Staff engineer"
      - type: compare
        variant: pros-cons
        left: { title: "Pros", items: ["No boilerplate", "Consistent theme", "Fast"] }
        right: { title: "Cons", items: ["Fixed block set"] }
      - type: feature-matrix
        columns: [{ name: "Free", sub: "0 $" }, { name: "Team", sub: "9 $", badge: "Popular" }, { name: "Org", sub: "Ask" }]
        highlight_col: 1
        rows:
          - { group: "Core" }
          - { feature: "Blocks", values: [true, true, true] }
          - { feature: "Private links", values: [false, true, true] }
          - { group: "Admin" }
          - { feature: "SSO", values: [false, false, true], note: "SAML" }
          - { feature: "Seats", values: ["1", "10", "Unlimited"] }
      - type: definition-list
        layout: inline
        items:
          Anchor: "A named place you can link to with `#id`."
          TOC: "A table of contents built from headings."
      - type: checklist
        title: "Release checklist"
        summary: true
        items:
          - "[x] Containers"
          - "[x] Media"
          - { label: "Docs", status: blocked, note: "waiting for review" }
          - "[ ] Changelog"
      - type: embed
        src: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        caption: "Link cards open in a new tab (iframes are blocked by the viewer CSP)."

  - type: cta
    title: "Ready to build?"
    body: "Start from the showcase spec and trim what you don't need."
    buttons:
      - { label: "Get started", href: "#cards" }
      - { label: "Docs", href: "https://example.com/docs", variant: ghost }
