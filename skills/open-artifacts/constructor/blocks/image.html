<div class="image-block {{_cls}}" style="{{_root_style}}">
  {{#if title}}<div class="image-block__title">{{title}}</div>{{/if}}
  <figure>
    {{#if _href}}<a class="image-block__link" {{{_link_attrs}}}>{{/if}}<img src="{{src}}" alt="{{alt}}" loading="{{_loading}}"{{#if _img_style}} style="{{_img_style}}"{{/if}}{{#if zoomable}} data-zoomable="true"{{#if _group}} data-oa-group="{{_group}}"{{/if}} data-caption="{{_cap_text}}" tabindex="0" role="button" aria-label="Zoom image: {{alt}}"{{/if}}>{{#if _href}}</a>{{/if}}
    {{#if _has_cap}}<figcaption>{{{_caption_html}}}{{#if credit}}<span class="image-block__credit">{{credit}}</span>{{/if}}</figcaption>{{/if}}
  </figure>
</div>
