<section class="oa-cta oa-cta--{{_bg}} oa-cta--{{_align}}" style="{{_style}}">
  <div class="oa-cta__text">
    <h2 class="oa-cta__title">{{title}}</h2>
    {{#if _body_html}}<div class="oa-cta__body">{{{_body_html}}}</div>{{/if}}
  </div>
  {{#if _buttons_html}}<div class="oa-cta__actions">{{{_buttons_html}}}</div>{{/if}}
</section>
