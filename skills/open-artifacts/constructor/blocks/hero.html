<section class="hero{{#if align_center}} hero--center{{/if}}" role="banner">
  {{#if badge}}<span class="hero__badge">{{badge}}</span>{{/if}}
  <h1 class="hero__title">{{title}}</h1>
  {{#if subtitle}}<p class="hero__subtitle">{{subtitle}}</p>{{/if}}
  {{#if meta}}<p class="hero__meta">{{meta}}</p>{{/if}}
</section>
